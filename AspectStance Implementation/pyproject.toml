[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aspectstance"
version = "1.0.0"
description = "AspectStance: unsupervised discovery of target-specific aspects for stance detection"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Milad Allahgholi" },
  { name = "Hossein Rahmani" },
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "umap-learn>=0.5.5",
  "xgboost>=2.0",
  "joblib>=1.3",
  "openai>=1.40",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
offline = ["wordllama>=0.3"]

[project.scripts]
aspectstance = "aspectstance.cli:main"

[tool.setuptools]
packages = ["aspectstance"]
